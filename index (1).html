<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#194f78"><link rel="manifest" href="manifest.json">
<title>Company Vehicle Driver Time Sheet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172334;padding:12px 12px 90px}header{background:#194f78;color:white;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px}h1{font-size:20px;margin:0 0 5px}header small{opacity:.9}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0000000b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:bold;color:#526273;display:block;margin-bottom:4px}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font-size:15px;background:#fff;color:#172334}textarea{min-height:64px;resize:vertical}.full{grid-column:1/-1}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}button{border:0;border-radius:10px;padding:12px 10px;font-size:15px;font-weight:bold;background:#194f78;color:white}button.secondary{background:#e2e8f0;color:#1e293b}button.green{background:#13804d}button.red{background:#b42323}.record{border:1px solid #dbe4ed;border-radius:12px;padding:12px;margin:9px 0;background:#f9fbfd}.record strong{color:#194f78}.small{font-size:13px;color:#64748b;margin:5px 0}.record-actions{display:flex;gap:7px;margin-top:8px}.record-actions button{padding:8px;font-size:13px;flex:1}.sticky{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0001;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.sticky button{font-size:13px;padding:11px 6px}.empty{text-align:center;color:#64748b;padding:20px}.summary{display:flex;justify-content:space-between;font-size:14px;font-weight:bold;margin-bottom:6px}
</style></head><body>
<header><h1>COMPANY VEHICLE – DRIVER TIME SHEET</h1><small>Enter time only — all other fields are optional</small></header>
<section class="card"><div class="grid">
<div><label>Vehicle / Plate No.</label><input id="plate" placeholder="Vehicle plate"></div>
<div><label>Month</label><select id="month"></select></div>
<div><label>Year</label><input id="year" inputmode="numeric" placeholder="Year"></div>
</div></section>
<section class="card"><h3 style="margin:0 0 12px;color:#194f78">Add Trip / Work Record (Time required, everything else optional)</h3><div class="grid">
<div><label>Date</label><input id="date" type="date"></div><div><label>Driver Name</label><input id="driver" placeholder="Driver name"></div>
<div><label>Start Time</label><input id="start" type="time"></div><div><label>End Time</label><input id="end" type="time"></div>
<div><label>Total Hours (auto)</label><input id="hours" readonly placeholder="Calculated automatically"></div><div><label>Vehicle KM (optional)</label><input id="km" type="number" min="0" step="0.1" placeholder="KM"></div>
<div class="full"><label>Location / Destination</label><input id="destination" placeholder="From / destination"></div>
<div class="full"><label>Work Details / Purpose</label><textarea id="purpose" placeholder="Work description"></textarea></div>
<div><label>Driver Signature (name)</label><input id="dsig" placeholder="Driver"></div><div><label>Supervisor Signature (name)</label><input id="ssig" placeholder="Supervisor"></div>
</div><div class="btns"><button onclick="addRecord()">＋ Save Record</button><button class="secondary" onclick="clearForm()">Clear Form</button></div></section>
<section class="card"><div class="summary"><span>Saved Records</span><span id="totalCount">0 records</span></div><div id="records"></div></section>
<div class="sticky"><button onclick="shareRecords()">Share WhatsApp</button><button class="green" onclick="exportCSV()">Export Excel CSV</button><button class="secondary" onclick="backupJSON()">Backup</button></div>
<script>
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];const m=document.getElementById('month');months.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=x;m.append(o)});let now=new Date();m.value=now.getMonth();year.value=now.getFullYear();date.value=now.toISOString().slice(0,10);
let rows=JSON.parse(localStorage.getItem('driverTimeRecords')||'[]');
function hoursCalc(){if(start.value&&end.value){let a=start.value.split(':').map(Number),b=end.value.split(':').map(Number),min=(b[0]*60+b[1])-(a[0]*60+a[1]);if(min<0)min+=1440;hours.value=(min/60).toFixed(2)+' h';}else hours.value=''}start.addEventListener('change',hoursCalc);end.addEventListener('change',hoursCalc);
function save(){localStorage.setItem('driverTimeRecords',JSON.stringify(rows))}
function addRecord(){if(!start.value&&!end.value){alert('Please enter at least Start Time or End Time. Other fields are optional.');return}let r={date:date.value,driver:driver.value.trim(),destination:destination.value.trim(),start:start.value,end:end.value,hours:hours.value,km:km.value,purpose:purpose.value.trim(),dsig:dsig.value.trim(),ssig:ssig.value.trim(),plate:plate.value.trim(),month:Number(month.value),year:year.value};rows.unshift(r);save();render();clearForm(false)}
function clearForm(resetDate=true){['driver','destination','start','end','hours','km','purpose','dsig','ssig'].forEach(id=>document.getElementById(id).value='');if(resetDate)date.value=new Date().toISOString().slice(0,10)}
function render(){let list=document.getElementById('records');list.innerHTML='';let filtered=rows.filter(r=>r.month===Number(month.value)&&String(r.year)===String(year.value)&&(r.plate||'')===plate.value.trim());totalCount.textContent=filtered.length+' records';if(!filtered.length){list.innerHTML='<div class="empty">No saved records for this vehicle/month.</div>';return}filtered.forEach((r)=>{let idx=rows.indexOf(r),div=document.createElement('div');div.className='record';div.innerHTML=`<strong>${escapeHTML(r.date)} · ${escapeHTML(r.driver)}</strong><div class="small">📍 ${escapeHTML(r.destination)} · ${escapeHTML(r.start||'—')} → ${escapeHTML(r.end||'—')} · ${escapeHTML(r.hours||'—')}</div><div class="small">KM: ${escapeHTML(r.km||'—')} | ${escapeHTML(r.purpose||'No details')}</div><div class="small">Driver: ${escapeHTML(r.dsig||'—')} | Supervisor: ${escapeHTML(r.ssig||'—')}</div><div class="record-actions"><button class="secondary" onclick="removeRecord(${idx})">Delete</button></div>`;list.append(div)})}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function removeRecord(i){if(confirm('Delete this record?')){rows.splice(i,1);save();render()}}
function filtered(){return rows.filter(r=>r.month===Number(month.value)&&String(r.year)===String(year.value)&&(r.plate||'')===plate.value.trim())}
function shareRecords(){let rs=filtered();if(!rs.length){alert('No records to share for selected vehicle/month.');return}let lines=[`COMPANY VEHICLE – DRIVER TIME SHEET`,`Vehicle: ${plate.value||'—'} | ${months[Number(month.value)]} ${year.value}`,`Date | Driver | Destination | Start | End | Hours | KM | Purpose | Driver Sign | Supervisor Sign`];rs.forEach(r=>lines.push([r.date,r.driver,r.destination,r.start,r.end,r.hours,r.km,r.purpose,r.dsig,r.ssig].map(x=>String(x||'—').replace(/[|\n]/g,' ')).join(' | ')));let msg=lines.join('\n');if(navigator.share){navigator.share({title:'Driver Time Sheet',text:msg}).catch(()=>copyText(msg))}else copyText(msg)}
function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('Table copied. Paste it in WhatsApp.')).catch(()=>alert(t))}
function exportCSV(){let rs=filtered();if(!rs.length){alert('No records to export.');return}let headers=['Date','Driver Name','Location / Destination','Start Time','End Time','Total Hours','Vehicle KM','Work Details / Purpose','Driver Signature','Supervisor Signature','Vehicle Plate','Month','Year'];let data=rs.map(r=>[r.date,r.driver,r.destination,r.start,r.end,r.hours,r.km,r.purpose,r.dsig,r.ssig,r.plate,months[r.month],r.year]);let csv='\uFEFF'+[headers,...data].map(row=>row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Driver_Time_Sheet_${plate.value||'vehicle'}_${months[Number(month.value)]}_${year.value}.csv`;a.click();URL.revokeObjectURL(url)}
function backupJSON(){let blob=new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Driver_Time_Sheet_Backup.json';a.click();URL.revokeObjectURL(url)}
plate.addEventListener('input',render);month.addEventListener('change',render);year.addEventListener('input',render);render();if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
